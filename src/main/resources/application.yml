# start
spring:
  # Project: name
  application:
    name: cooking
  # Mysql: set up
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  # JPA: set up
  jpa:
    show-sql: true
    database: mysql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  servlet:
    multipart:
      location: ${IMG_LOCATION}
      max-file-size: ${IMG_SIZE}


jwt:
  secret: ${JWT_SECRET}



